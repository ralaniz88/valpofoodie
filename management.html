<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Restaurant management | Valpo Foodie</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="/">valpo<span>foodie.</span></a><a href="/">Public website</a></header><main class="portal"><h1>Restaurant management</h1><p id="status" role="status"></p><section id="login"><h2>Sign in or claim your listing</h2><form id="auth"><label>Email<input type="email" id="email" required autocomplete="email"></label><label>Password<input type="password" id="password" required minlength="8" autocomplete="current-password"></label><button type="submit">Sign in</button><button type="button" id="register">Create account</button></form></section><section id="workspace" hidden><div class="portal-top"><h2 id="role"></h2><button id="logout">Sign out</button></div><label>Choose restaurant<select id="restaurant"></select></label><section id="claimbox"><h3>Claim your restaurant</h3><form id="claim"><label>Business contact and proof of affiliation<textarea id="contact" required></textarea></label><button>Submit claim for approval</button></form></section><section id="editor" hidden><h3>Business profile</h3><form id="profile"></form><h3>Upload logo or cover</h3><form id="upload"><select id="imagekind"><option value="logo_url">Logo</option><option value="cover_url">Cover photo</option></select><input id="file" type="file" accept="image/jpeg,image/png,image/webp" required><button>Upload image</button></form><h3>Soups of the day</h3><form id="soup"><label>Soup name<input id="soupname" required></label><label>Dietary classification<select id="diet"><option value="regular">Regular / meat-based</option><option value="vegetarian">Vegetarian</option><option value="vegan">Vegan</option></select></label><label>Display duration<select id="duration"><option value="1">Today only</option><option value="7">One week</option><option value="30">One month</option><option value="">Until removed</option></select></label><button>Add soup</button></form><div id="soups-admin"></div><h3>Specials and happy hours</h3><form id="promo"><select id="kind"><option value="special">Local deal</option><option value="happy">Happy hour</option></select><input id="promotitle" placeholder="Offer title" required><textarea id="details" placeholder="Details, days and times"></textarea><label>Expiration (optional)<input id="expiry" type="datetime-local"></label><button>Publish offer</button></form><div id="promos-admin"></div></section><section id="claims-admin" hidden><h3>Pending claim requests</h3><div id="claims-list"></div><h3>Restaurant owner access</h3><div id="owners-list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db.js"></script><script src="management.js"></script></body></html>
